<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="app" content="index.xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Predictive Maintenance</title>
  <script id="vscode-boot">var boot = {
      "runtime": "https://runtime.xios3.com/xios_v2026.10.0/",
      "titlePrefix": "Predictive Maintenance",
      "startup": "index.xml",
      "tenant": "jodu",
      "tenantId": "2",
      "theme": "cbeapps"
    };</script>
  <script id="vscode-xios-version" src="https://runtime.xios3.com/xios_v2026.10.0/boot.js"></script>
</head>
<body style="background-color:#fff;">
  <div id="activityLayer"
    style="width:64px;height:64px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9999;contain:strict">
    <svg class="!circular" viewBox="25 25 50 50">
      <style>
        @keyframes dash {
          0% {
            stroke-dasharray: 1, 200;
            stroke-dashoffset: 0
          }

          50% {
            stroke-dasharray: 89, 200;
            stroke-dashoffset: -35
          }

          100% {
            stroke-dasharray: 89, 200;
            stroke-dashoffset: -124
          }
        }

        .\!circular {
          animation: rotate 2s linear infinite;
          transform-origin: center center
        }

        @keyframes rotate {
          100% {
            transform: rotate(360deg)
          }
        }

        .\!path {
          stroke-dasharray: 1, 200;
          animation: dash 1.5s ease-in-out infinite;
          stroke-linecap: round;
          stroke: #000;
          stroke-width: 3;
          fill: none
        }
      </style>
      <circle class="!path" cx="50" cy="50" r="20"></circle>
    </svg>
  </div>
</body>
</html>
